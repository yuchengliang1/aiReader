name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai_review:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR diff
        id: diff
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const diffUrl = pr.diff_url;

            const res = await fetch(diffUrl, {
              headers: { "Authorization": `token ${process.env.GITHUB_TOKEN}` }
            });
            const diffText = await res.text();

            // 防止超长：截断（你也可以改成按文件分段）
            const max = 12000;
            const trimmed = diffText.length > max ? diffText.slice(0, max) + "\n\n[diff truncated]" : diffText;

            core.setOutput("diff", trimmed);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Call LLM for review
        id: llm
        run: |
          set -e
          jq -n --arg diff "${{ steps.diff.outputs.diff }}" '{
            "model": "anthropic/claude-sonnet-4.5",
            "messages": [
              {
                "role": "system",
                "content": "你是严格的代码审查员。请按：总体评价、风险点（安全/性能/并发/兼容性）、可维护性建议、可测试性建议、可能的bug、必须修改项/可选项 输出。尽量引用diff中的具体行/片段。"
              },
              {
                "role": "user",
                "content": "请review这个PR diff：\n\n<你的diff内容>"
              }
            ]
          }' > payload.json

          curl https://openrouter.ai/api/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -d @payload.json \
            | tee response.json

          # 抽取文本（根据接口返回格式可能需要调整）
          cat response.json | jq -r '.output[0].content[0].text' > review.txt
        env:
          OPENROUTER_API_Key: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Comment review on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("review.txt", "utf8");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "## AI Review\n\n" + body
            });
